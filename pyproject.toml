[project]
name = "text-to-speech-service"
description="Creates speech audio from provided text."
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "pocket-tts>=4.0.1",
    "soundfile>=0.14.0",
    "pywin32>=306; sys_platform == 'win32'",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
